name: Cloud CI — SentinelForge Forge & MCP Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run SentinelForge Engine, Forge Manifest & MCP Server Test Suite
        run: node --test tests/sentinel.test.mjs
