modules:
  jira:issuePanel:
    - key: sentinelforge-jira-panel
      resource: main-ui
      resolver:
        function: resolver
      render: native
      title: SentinelForge v4.0 Zero-Leak & MCP Guard
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg

  confluence:contentBylineItem:
    - key: sentinelforge-confluence-byline
      resource: main-ui
      resolver:
        function: resolver
      render: native
      title: SentinelForge v4.0 Privacy & Prompt-Injection Audit
      tooltip: Inspect Confluence page for indirect prompt injections, leaked credentials, and Android/iOS privacy risks

  rovo:agent:
    - key: sentinelforge-security-agent
      name: SentinelForge Guard
      description: Autonomous 4-Layer Zero-Leak Secret, Indirect Prompt-Injection, Mobile Privacy & SHA-256 Ledger Guardian for Jira and Confluence.
      prompt: >
        You are SentinelForge Security Guardian v4.0. Whenever an engineer asks you
        to audit a Jira ticket, Confluence specification, AndroidManifest.xml, or Apple iOS
        Info.plist, invoke the scan-content-security action to neutralize indirect LLM prompt
        injections, leaked Atlassian/AWS/Stripe/GitHub tokens, Luhn payment cards, high-entropy
        secrets, and silent mobile camera-roll harvesting chains. When asked to verify compliance
        or tamper resistance, invoke verify-audit-ledger to check the SHA-256 hash-chained Forge
        Storage ledger. Never echo raw secrets back verbatim.
      conversationStarters:
        - Audit this Jira issue for indirect prompt injections, AWS keys, or PII
        - Check this AndroidManifest.xml or iOS Info.plist for silent camera-roll harvesting chains
        - Verify the SHA-256 cryptographic audit ledger chain for zero tampering
      actions:
        - scan-content-security
        - verify-audit-ledger

  action:
    - key: scan-content-security
      name: Scan Content Security
      function: rovo-action-handler
      actionVerb: GET
      description: Runs 4-layer indirect prompt-injection, secret DLP, and Android 8-17 / iOS privacy audit strictly inside Atlassian Forge serverless RAM with 0 external egress.
      inputs:
        payload:
          title: Text or Manifest Payload
          type: string
          required: true
          description: Raw issue description, Confluence page text, AndroidManifest.xml, or iOS Info.plist to audit.
    - key: verify-audit-ledger
      name: Verify SHA-256 Audit Ledger
      function: rovo-ledger-action-handler
      actionVerb: GET
      description: Cryptographically verifies SentinelForge's append-only SHA-256 hash-chained Forge Storage audit ledger and returns tamper-proof compliance status.

  trigger:
    - key: issue-leak-auto-watcher
      function: issue-trigger-handler
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue

  function:
    - key: resolver
      handler: index.handler
    - key: rovo-action-handler
      handler: index.rovoActionHandler
    - key: rovo-ledger-action-handler
      handler: index.rovoLedgerActionHandler
    - key: issue-trigger-handler
      handler: index.issueTriggerHandler

resources:
  - key: main-ui
    path: src/frontend/index.jsx

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:confluence-content.summary
    - read:page:confluence
    - storage:app

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/dfccfe85-2f0a-4c82-9c88-c1dcf76cd975
